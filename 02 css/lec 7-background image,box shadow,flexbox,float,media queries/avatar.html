<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="avatar.css">
    <style>
.male{
            width: 200px;
            height:200px;
            border:2px solid black;

            background-image: url("./boy\ avatar.jpg");
            background-size:cover;
            border-radius: 0 0 5px 5px;
            border-radius: 50%;

            
        }
        .female{
            width: 200px;
            height:200px;
            border:2px solid black;

            background-image: url("./girl\ avatar.jpg");
            background-size:cover;
            border-radius: 0 0 5px 5px;
            border-radius: 50%;

            
        }


        section{
            height: 300px;
            width:200px;
            border:2px solid black;
            border-radius: 5px;
            background-color: rgba(211, 211, 211, 0.28);
            padding:10px;
            transition: all .5s ease .2s;
            margin-left: 5px;
            
        }
        
        
         section:hover{
box-shadow: 2px 2px 10px black;
        }
        .profile{
            display: flex;
        }
        h3{
             border-top: 2px solid black; 
             border-radius: 0 0 5px 5px ;
        }
        

    </style> 
</head>
<body>
    <div class="profile">
     <section>

                 <div class="male"></div>
                 <h3> Debendra mohanta</h3>
                 <p> Web Developer</p>
    </section>
    
    
     <section>
         
                  <div class="female"></div>
                  <h3> Anayaa Mohanta</h3>
                  <p>Web Developer</p>
                  
     </section>
     </div>

    </body>
    </html>
