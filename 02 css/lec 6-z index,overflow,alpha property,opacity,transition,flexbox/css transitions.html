<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            height:200px;
            width:200px;
            background-color: aqua;

            transition-duration: 1s;
            transition-delay:.2s;
            transition-timing-function: ease;
        }

        div:hover{
            background-color: black;
            border-radius: 50%;
            color:red;
            text: size 64px;
            padding:30px;
            padding-bottom: 30px;
           
        }
        div:hover::after{
            content: "Debendra";
        }
        section{
            height:200px;
            width:200px;
            background-color: darkolivegreen;
            margin-top: 0 auto;
            transition:all 2s ease-in 0.2s;
            transition:2s;
        }
        section:hover{
            margin-top:400px;
            background-color: red;
        }
    </style>
</head>
<body>
   <div></div> 
   <section></section>
</body>
</html>
